[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfm-fw"
version = "0.1.0"
description = "CFM-FW: Feature weights-based comprehensive causal multi-objective counterfactual framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfm_fw"]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "pytest>=8.0.0",
]
